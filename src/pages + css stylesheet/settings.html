<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tēmas | DuraKlash</title>
        <link rel="stylesheet" href="./main.css">
    </head>
    <body class="auth-page clean-panels-page">
        <a class="auth-back-link" href="./index.html" aria-label="Atpakaļ uz sākumu">Atpakaļ</a>
        <main id="auth-panel" class="content-panel settings-panel">
            <header class="auth-header">
                <h1>DuraKlash</h1>
            </header>
            <p id="settings-status" role="status" aria-live="polite"></p>
            <section class="settings-section theme-settings" aria-labelledby="theme-settings-heading">
                <h3 id="theme-settings-heading">Izskats</h3>
                <fieldset class="theme-options">
                    <legend>Izvēlies tēmu</legend>
                    <label><input type="radio" name="theme" value="CLASSIC"><span><strong>Klasiskā</strong><small>Sākotnējais izskats ar galda un koka attēliem.</small></span></label>
                    <label><input type="radio" name="theme" value="LIGHT"><span><strong>Gaišā</strong><small>Gaišs, vienkāršots lapu noformējums.</small></span></label>
                    <label><input type="radio" name="theme" value="DARK"><span><strong>Tumšā</strong><small>Tumšs, vienkāršots lapu noformējums.</small></span></label>
                </fieldset>
                <p class="settings-note">Pieslēdzoties tēma tiek saglabāta tavā kontā; viesiem — šajā pārlūkā.</p>
            </section>
        </main>
        <script type="module" src="../js/settings.js"></script>
    </body>
</html>
