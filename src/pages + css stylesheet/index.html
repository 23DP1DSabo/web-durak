<!--Šī ir tā lapa, kas veras vaļā palaižot localhost-->

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>DuraKlash</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" type="text/css" href="./main.css">
    </head>
    <body>
        <div id="frontpage-content">
            <div id="frontpage-matchmaking">
                <header class="matchmaking-header">
                    <h1>DuraKlash</h1>
                </header>
                <div id="matchmaking-mode-selection">
                <div id="regular-mode-games" class="game-rooms">
                    <h2>Spēles istabas</h2>
                    <button id="game-classic" class="game-button" data-room-mode="classic">Klasiskais duraks</button>
                    <button id="game-passing" class="game-button" data-room-mode="passing">Padošanu duraks</button>
                    <button id="game-japan" class="game-button" data-room-mode="japan">Japāņu duraks</button>
                </div>
                <div id="quick-mode-games" class="game-rooms">
                    <h2>Ātrās spēles istabas</h2>
                    <button id="quick-game-classic" class="game-button">Klasiskais duraks</button>
                    <button id="quick-game-passing" class="game-button">Padošanu duraks</button>
                    <button id="quick-game-japan" class="game-button">Japāņu duraks</button>
                </div>
            </div>
            </div>
            <nav id="side-navigation-menu">
                <li><a id="account-link" href="./auth.html">Pieslēgties</a></li>
                <li id="friends-nav-item" hidden><a href="./friends.html">Draugi</a></li>
                <li id="admin-nav-item" hidden><button id="admin-users-open" type="button">Administrēšana</button></li>
                <li><a href="./rules.html">Pamācība</a></li>
                <li><a href="./settings.html">Tēmas</a></li>
            </nav>
        </div>
        <dialog id="room-choice-dialog" class="room-dialog" aria-labelledby="room-dialog-title">
            <button class="room-dialog-close" type="button" data-room-action="close">Aizvērt</button>
            <p id="room-dialog-mode" class="eyebrow"></p>
            <h2 id="room-dialog-title">Spēles istaba</h2>
            <div id="room-choice-actions" class="room-dialog-actions">
                <button type="button" data-room-action="create">Izveidot istabu</button>
                <button type="button" data-room-action="show-join">Pievienoties istabai</button>
            </div>
            <form id="join-room-form" hidden novalidate>
                <label for="room-code-input">8 simbolu istabas kods</label>
                <input id="room-code-input" name="code" type="text" minlength="8" maxlength="8" pattern="[A-Za-z0-9]{8}" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
                <p id="join-room-message" role="status" aria-live="polite" hidden></p>
                <div class="room-dialog-actions">
                    <button type="submit">Pievienoties</button>
                    <button type="button" data-room-action="back">Atpakaļ</button>
                </div>
            </form>
        </dialog>
        <dialog id="admin-users-dialog" class="admin-users-dialog" aria-labelledby="admin-users-title">
            <div class="admin-users-header">
                <h2 id="admin-users-title">Lietotāji</h2>
                <button id="admin-users-close" class="room-dialog-close" type="button">Aizvērt</button>
            </div>
            <div class="admin-random-ban-wrap">
                <button id="admin-random-ban" class="admin-random-ban" type="button">
                    <span>Random</span>
                    <span>ban</span>
                </button>
            </div>
            <p id="admin-users-status" role="status" aria-live="polite"></p>
            <label class="admin-user-search-label" for="admin-user-search">Meklēt lietotājus</label>
            <div class="admin-user-tools">
                <input
                    id="admin-user-search"
                    class="admin-user-search"
                    type="search"
                    placeholder="Meklēt pēc lietotājvārda un citiem atslēgvārdiem"
                    autocomplete="off"
                >
                <div class="admin-user-sort">
                    <button
                        id="admin-user-filter-toggle"
                        class="admin-user-sort-toggle"
                        type="button"
                        aria-expanded="false"
                        aria-controls="admin-user-filter-menu"
                    >Filtrēt</button>
                    <div
                        id="admin-user-filter-menu"
                        class="admin-user-sort-menu"
                        role="group"
                        aria-label="Lietotāju filtri"
                        hidden
                    >
                        <label for="admin-user-filter-account">Konta statuss</label>
                        <select id="admin-user-filter-account">
                            <option value="all">Visi</option>
                            <option value="active">Aktīvs</option>
                            <option value="banned">Bloķēts</option>
                        </select>
                        <label for="admin-user-filter-online">Tiešsaistes statuss</label>
                        <select id="admin-user-filter-online">
                            <option value="all">Visi</option>
                            <option value="online">Tiešsaistē</option>
                            <option value="offline">Bezsaistē</option>
                        </select>
                        <label for="admin-user-filter-login">Pēdējā pieslēgšanās</label>
                        <select id="admin-user-filter-login">
                            <option value="all">Visi</option>
                            <option value="logged-in">Ir pieslēdzies</option>
                            <option value="never">Nav pieslēdzies</option>
                        </select>
                    </div>
                </div>
                <div class="admin-user-sort">
                    <button
                        id="admin-user-sort-toggle"
                        class="admin-user-sort-toggle"
                        type="button"
                        aria-expanded="false"
                        aria-controls="admin-user-sort-menu"
                    >Kārtot</button>
                    <div
                        id="admin-user-sort-menu"
                        class="admin-user-sort-menu"
                        role="group"
                        aria-label="Kārtošanas iestatījumi"
                        hidden
                    >
                        <label for="admin-user-sort-by">Kārtot pēc</label>
                        <select id="admin-user-sort-by">
                            <option value="username">Lietotājvārds</option>
                            <option value="lastLogin">Pēdējā pieslēgšanās</option>
                            <option value="accountStatus">Konta statuss</option>
                            <option value="onlineStatus">Tiešsaistes statuss</option>
                        </select>
                        <label for="admin-user-sort-direction">Secība</label>
                        <select id="admin-user-sort-direction">
                            <option value="asc">Augošā</option>
                            <option value="desc">Dilstošā</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="admin-users-table-wrap">
                <table class="admin-users-table">
                    <thead>
                        <tr>
                            <th scope="col">Avatar</th>
                            <th scope="col">Lietotājvārds</th>
                            <th scope="col">Tiešsaistes statuss</th>
                            <th scope="col">Konta statuss</th>
                            <th scope="col">Pēdējā pieslēgšanās</th>
                            <th scope="col">Administrēšana</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-list"></tbody>
                </table>
            </div>
        </dialog>
        <script type="module" src="../js/matchmaking.js"></script>
        <script type="module" src="../js/account-status.js"></script>
        <script type="module" src="../js/admin-panel.js"></script>
        <script type="module" src="../js/theme.js"></script>
    </body>
</html>
