<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Spēle | DuraKlash</title>
        <link rel="stylesheet" href="./main.css">
    </head>
    <body class="game-table-page">
        <header class="game-table-header">
            <a class="game-brand" href="./index.html">DuraKlash</a>
            <div class="match-details">
                <span id="match-mode">Spēle</span>
                <span class="match-detail-divider" aria-hidden="true"></span>
                <span>Istaba <strong id="match-code"></strong></span>
                <span class="match-detail-divider" aria-hidden="true"></span>
                <span id="match-time-limit">10 min katram</span>
            </div>
            <a id="return-to-room" class="game-exit-link" href="./index.html">Iziet</a>
        </header>

        <main class="table-stage" aria-label="Spēles galds">
            <div class="table-status">
                <p id="game-status" role="status" aria-live="polite"></p>
                <p class="trump-indicator">Trumpis <img id="trump-card" alt=""></p>
                <div id="draw-pile" class="draw-pile" aria-label="Atlikušās kavas kārtis"></div>
                <p id="draw-pile-count" class="draw-pile-count"></p>
            </div>
            <section class="table-seat opponent-seat" aria-label="Pretinieks">
                <div class="seat-identity">
                    <span class="seat-avatar opponent-avatar" aria-hidden="true">P</span>
                    <div>
                        <h1>Bots</h1>
                        <p> </p>
                    </div>
                </div>
                <aside id="opponent-clock" class="player-clock opponent-clock" aria-label="Pretinieka atlikušais gājiena laiks">
                    <span>Bota laiks</span>
                    <time id="opponent-time">10:00</time>
                </aside>
                <div id="opponent-hand" class="card-hand opponent-hand" aria-label="Pretinieka kārtis ar mugurām uz augšu"></div>
            </section>

            <section class="play-surface" aria-label="Kāršu spēles zona">
                <div id="played-cards" class="played-cards" aria-label="Kārtis uz galda" aria-live="polite">
                </div>
                <div id="game-actions" class="game-actions">
                    <button id="play-card" type="button" disabled>Uzbrukt</button>
                    <button id="take-card" type="button" hidden>Paņemt kārti</button>
                    <button id="pass-card" type="button" hidden>Padot</button>
                    <button id="finish-attack" type="button" hidden>Pabeigt uzbrukumu</button>
                </div>
            </section>

            <section class="table-seat player-seat" aria-label="Tava vieta">
                <div class="seat-identity">
                    <span class="seat-avatar player-avatar" aria-hidden="true">D</span>
                    <div>
                        <h2 id="match-player-name">Spēlētājs</h2>
                        <p><span class="seat-you-label">Tu</span></p>
                    </div>
                </div>
                <div id="player-hand" class="card-hand player-hand" aria-label="Tavas kārtis"></div>
            </section>
            <aside id="player-clock" class="player-clock" aria-label="Tavs atlikušais gājiena laiks">
                <span>Tavs laiks</span>
                <time id="player-time">10:00</time>
            </aside>
        </main>
        <dialog id="game-result-dialog" class="game-result-dialog" aria-labelledby="game-result-title">
            <img id="game-result-icon" class="game-result-icon" alt="" hidden>
            <section class="game-result-sign">
                <h2 id="game-result-title"></h2>
                <div class="game-result-actions">
                    <button id="restart-game" type="button">Jauna spēle</button>
                    <a class="game-result-menu-link" href="./index.html">Galvenā izvēlne</a>
                </div>
            </section>
        </dialog>
        <script type="module" src="../js/game-table.js"></script>
        <script type="module" src="../js/theme.js"></script>
    </body>
</html>
