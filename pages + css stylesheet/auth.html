<!DOCTYPE html>
<html lang="lv">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pieslēgties | DuraKlash</title>
        <link rel="stylesheet" href="/pages%20+%20css%20stylesheet/main.css">
    </head>
    <body class="auth-page">
        <a class="auth-back-link" href="./index.html" aria-label="Atpakaļ uz sākumu">Atpakaļ</a>
        <main id="auth-panel">
            <header class="auth-header">
                <h1>DuraKlash</h1>
            </header>
            <div class="auth-tabs" role="group" aria-label="Konta darbība">
                <button id="show-login" type="button" aria-pressed="true">Pieslēgties</button>
                <button id="show-register" type="button" aria-pressed="false">Reģistrēties</button>
            </div>

            <form id="login-form">
                <h2>Pieslēgties</h2>
                <div class="auth-field">
                    <label for="login-email">E-pasts</label>
                    <input id="login-email" name="email" type="email" autocomplete="email" required maxlength="255">
                </div>
                <div class="auth-field">
                    <label for="login-password">Parole</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
                </div>
                <button type="submit">Pieslēgties</button>
            </form>

            <form id="register-form" hidden>
                <h2>Reģistrēties</h2>
                <div class="auth-field">
                    <label for="register-name">Vārds</label>
                    <input id="register-name" name="name" autocomplete="name" required maxlength="50">
                </div>
                <div class="auth-field">
                    <label for="register-username">Lietotājvārds</label>
                    <input id="register-username" name="username" autocomplete="username" required maxlength="50" pattern="[\p{L}\p{N}_]+" title="Burti, cipari un pasvītrojums">
                </div>
                <div class="auth-field">
                    <label for="register-email">E-pasts</label>
                    <input id="register-email" name="email" type="email" autocomplete="email" required maxlength="255">
                </div>
                <div class="auth-field">
                    <label for="register-password">Parole</label>
                    <input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="password-help">
                    <small id="password-help">Parolei jābūt no 8 līdz 128 rakstzīmēm.</small>
                </div>
                <div class="auth-field">
                    <label for="register-confirm-password">Atkārtojiet paroli</label>
                    <input id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
                </div>
                <button type="submit">Izveidot kontu</button>
            </form>

            <section id="account" hidden>
                <h2 id="account-name"></h2>
                <p id="account-email"></p>
                <p><a href="./index.html">Doties uz spēli</a></p>
                <button id="logout" type="button">Izrakstīties</button>
            </section>
            <p id="auth-message" role="status" aria-live="polite"></p>
        </main>
        <script type="module" src="../auth.js"></script>
    </body>
</html>
